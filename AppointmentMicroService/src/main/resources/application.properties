#Before Docker
patient-service.url=http://localhost:8081
doctor-service.url=http://localhost:8082
appointment-service.url=http://localhost:8083
notification-service.url=http://localhost:8086

spring.application.name=appointment-service
custom.message=Hello from Appointment Config
#PostGreSql
spring.datasource.url=jdbc:postgresql://localhost:5433/appointment_db
spring.datasource.username=Manoj
spring.datasource.password=123456789
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8083

#Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#Circuit-Breaker Ressilince4j
resilience4j.circuitbreaker.instances.doctorService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.doctorService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.doctorService.waitDurationInOpenState=10s

#Zipkin
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0
management.tracing.enabled=true
