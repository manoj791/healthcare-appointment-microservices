services:
  postgres:
      image: postgres:latest
      container_name: postgres_Patient_container
      environment:
        POSTGRES_DB: patient_db
        POSTGRES_USER: Manoj
        POSTGRES_PASSWORD: 123456789
      ports:
        - "5432:5432"
      networks:
      - ms-network
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin4@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5052:80"
    networks:
      - ms-network
    depends_on:
      - postgres

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ms-network

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - ms-network

  eureka-server:
    image: manoj171717/serviceregistry
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - ms-network

  config-server:
    image: manoj171717/configserver
    container_name: config-server
    depends_on:
      - eureka-server
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - ms-network

  patient-service:
    build: ./PatientMs
    container_name: patient-service
    depends_on:
      - postgres
      - config-server
      - eureka-server
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - ms-network

  doctor-service:
    build: ./DocterMs
    container_name: doctor-service
    depends_on:
      - postgres
      - config-server
      - eureka-server
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - ms-network

  appointment-service:
    build: ./Appointment
    container_name: appointment-service
    depends_on:
      - postgres
      - rabbitmq
      - config-server
      - eureka-server
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - ms-network
  notification-service:
    build: ./Notification_Service
    container_name: notification-service
    depends_on:
      - rabbitmq
      - config-server
      - eureka-server
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MAIL_USERNAME=jangammanojkumar16@gmail.com
      - MAIL_PASSWORD=zgpapuvtkbrpudmi
    networks:
      - ms-network
  api-gateway:
    build: ./Api-GateWay
    container_name: api-gateway
    depends_on:
      - config-server
      - eureka-server
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
    restart: always
    networks:
      - ms-network

volumes:
  postgres:
  pgadmin:

networks:
  ms-network:
    driver: bridge